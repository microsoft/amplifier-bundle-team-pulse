name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Check lockfile
        run: uv lock --check
      - name: Install workspace dependencies
        run: uv sync --all-packages --all-extras --locked
      - name: Test team-pulse-lib
        run: uv run --locked pytest team-pulse-lib/tests
      - name: Test tool-team-pulse
        run: uv run --locked pytest modules/tool-team-pulse/tests
      - name: Lint
        run: uv run --locked ruff check team-pulse-lib modules/tool-team-pulse